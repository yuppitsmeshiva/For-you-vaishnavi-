<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Vaishnavi ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#050305;
    color:white;
}

.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at center,
            rgba(130,30,65,.35),
            transparent 55%
        ),
        radial-gradient(
            ellipse at 50% 110%,
            rgba(255,80,130,.15),
            transparent 50%
        ),
        #050305;
}

.scene::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:50;

    background:
        radial-gradient(
            ellipse,
            transparent 40%,
            rgba(0,0,0,.85) 100%
        );
}

/* GRAIN */

.grain{
    position:absolute;
    inset:-50%;
    z-index:45;
    pointer-events:none;
    opacity:.09;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");

    animation:grain .2s steps(2) infinite;
}

@keyframes grain{
    0%{transform:translate(0,0);}
    25%{transform:translate(2%,-3%);}
    50%{transform:translate(-3%,2%);}
    75%{transform:translate(3%,3%);}
    100%{transform:translate(-2%,-2%);}
}

/* LIGHT */

.light{
    position:absolute;

    width:70vw;
    height:70vw;

    max-width:900px;
    max-height:900px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,190,210,.13),
            transparent 65%
        );

    filter:blur(30px);

    animation:breathing 5s ease-in-out infinite;

    z-index:1;
}

@keyframes breathing{
    0%,100%{
        opacity:.5;
        transform:translate(-50%,-50%) scale(.9);
    }

    50%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.1);
    }
}

/* OPENING */

.opening{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    z-index:20;

    width:90%;

    animation:
        openingOut 2s ease 2.7s forwards;
}

.opening-small{
    font-family:"Cinzel",serif;

    font-size:clamp(10px,1.5vw,15px);

    letter-spacing:7px;

    color:rgba(255,220,225,.75);

    text-transform:uppercase;

    animation:fadeUp 2s ease forwards;
}

.opening-main{
    margin-top:20px;

    font-family:"Cormorant Garamond",serif;

    font-style:italic;

    font-size:clamp(28px,6vw,70px);

    font-weight:400;

    color:#fff4f6;

    text-shadow:
        0 0 30px rgba(255,100,150,.4);
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes openingOut{
    to{
        opacity:0;
        transform:translate(-50%,-60%) scale(1.1);
    }
}

/* FLOWERS */

.flower{
    position:absolute;

    left:50%;
    top:50%;

    z-index:15;

    font-size:clamp(35px,5vw,75px);

    opacity:0;

    filter:
        drop-shadow(0 0 15px rgba(255,100,150,.35));

    animation:
        flowerPop .8s cubic-bezier(.16,1,.3,1) forwards,
        flowerTravel 2.8s cubic-bezier(.16,1,.3,1) forwards;
}

.flower:nth-of-type(1){
    --x:5vw;
    --y:7vh;
    --delay:.1s;
}

.flower:nth-of-type(2){
    --x:15vw;
    --y:5vh;
    --delay:.25s;
}

.flower:nth-of-type(3){
    --x:94vw;
    --y:7vh;
    --delay:.4s;
}

.flower:nth-of-type(4){
    --x:86vw;
    --y:13vh;
    --delay:.55s;
}

.flower:nth-of-type(5){
    --x:6vw;
    --y:91vh;
    --delay:.7s;
}

.flower:nth-of-type(6){
    --x:15vw;
    --y:95vh;
    --delay:.85s;
}

.flower:nth-of-type(7){
    --x:94vw;
    --y:91vh;
    --delay:1s;
}

.flower:nth-of-type(8){
    --x:85vw;
    --y:95vh;
    --delay:1.15s;
}

@keyframes flowerPop{
    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(0)
            rotate(-180deg);
    }

    60%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.4)
            rotate(20deg);
    }

    100%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1)
            rotate(0);
    }
}

@keyframes flowerTravel{
    0%{
        left:50%;
        top:50%;
    }

    100%{
        left:var(--x);
        top:var(--y);
    }
}

/* BIRTHDAY */

.birthday{
    position:absolute;

    width:100%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    z-index:25;

    opacity:0;

    animation:
        birthdayReveal 2.5s cubic-bezier(.16,1,.3,1) 3.4s forwards;
}

@keyframes birthdayReveal{
    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.65);

        filter:blur(15px);
    }

    60%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.05);

        filter:blur(0);
    }

    100%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);

        filter:blur(0);
    }
}

.subtitle{
    font-family:"Cinzel",serif;

    font-size:clamp(9px,1.3vw,14px);

    letter-spacing:8px;

    color:#e6b5c2;

    text-transform:uppercase;

    margin-bottom:20px;
}

.birthday-title{
    font-family:"Playfair Display",serif;

    font-style:italic;

    font-weight:400;

    font-size:clamp(42px,8vw,105px);

    line-height:.9;

    color:#fff4f6;

    text-shadow:
        0 0 10px rgba(255,255,255,.3),
        0 0 40px rgba(255,70,120,.25);
}

.name{
    margin-top:10px;

    font-family:"Great Vibes",cursive;

    font-size:clamp(65px,13vw,165px);

    line-height:1;

    color:#e98ca8;

    text-shadow:
        0 0 20px rgba(255,100,150,.35),
        0 0 70px rgba(255,50,110,.2);

    animation:nameGlow 3s ease-in-out infinite alternate;
}

@keyframes nameGlow{
    from{
        text-shadow:
            0 0 15px rgba(255,100,150,.25);
    }

    to{
        text-shadow:
            0 0 30px rgba(255,120,160,.55),
            0 0 70px rgba(255,50,110,.25);
    }
}

.emojis{
    margin-top:25px;

    font-size:clamp(20px,3vw,32px);

    letter-spacing:10px;

    animation:emojiFloat 3s ease-in-out infinite;
}

@keyframes emojiFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}

.message{
    margin-top:25px;

    font-family:"Cormorant Garamond",serif;

    font-style:italic;

    font-size:clamp(18px,3vw,28px);

    color:rgba(255,235,240,.75);

    letter-spacing:2px;
}

/* LINE */

.line{
    width:0;

    height:1px;

    margin:25px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #e8a4b6,
            transparent
        );

    animation:lineReveal 2s ease 4.5s forwards;
}

@keyframes lineReveal{
    to{
        width:min(400px,70%);
    }
}

/* PETALS */

.petal{
    position:absolute;

    top:-50px;

    z-index:12;

    font-size:18px;

    opacity:.65;

    animation:falling linear infinite;
}

@keyframes falling{
    0%{
        transform:
            translateY(-50px)
            translateX(0)
            rotate(0);

        opacity:0;
    }

    10%{
        opacity:.8;
    }

    50%{
        transform:
            translateY(50vh)
            translateX(50px)
            rotate(180deg);
    }

    100%{
        transform:
            translateY(110vh)
            translateX(-50px)
            rotate(360deg);

        opacity:0;
    }
}

/* PARTICLES */

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#ffe5ed;

    box-shadow:
        0 0 8px #ffb6c9;

    z-index:8;

    animation:particleFloat 4s ease-in-out infinite;
}

@keyframes particleFloat{
    0%,100%{
        opacity:.1;
        transform:scale(.5);
    }

    50%{
        opacity:1;
        transform:scale(1.5);
    }
}

/* HEARTS */

.heart{
    position:absolute;

    bottom:-40px;

    z-index:10;

    opacity:0;

    animation:heartRise 8s linear infinite;
}

@keyframes heartRise{
    0%{
        transform:translateY(0) scale(.5);
        opacity:0;
    }

    15%{
        opacity:.5;
    }

    80%{
        opacity:.25;
    }

    100%{
        transform:
            translateY(-110vh)
            scale(1.2);

        opacity:0;
    }
}

/* NEXT PAGE */

.continue-btn{
    position:absolute;

    bottom:30px;
    left:50%;
    right:auto;

    transform:translateX(-50%);

    z-index:60;

    padding:12px 24px;

    border:1px solid rgba(255,180,200,.35);

    border-radius:50px;

    background:rgba(255,255,255,.06);

    backdrop-filter:blur(15px);

    color:#e8bdc8;

    text-decoration:none;

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:3px;

    opacity:0;

    transition:.4s;

    animation:continueAppear 2s ease 6s forwards;
}

.continue-btn:hover{
    opacity:1;

    background:rgba(255,100,140,.14);

    transform:
        translateX(-50%)
        translateY(-3px)
        scale(1.04);

    box-shadow:
        0 10px 30px rgba(255,80,130,.15);
}

@keyframes continueAppear{
    from{
        opacity:0;
        transform:
            translateX(-50%)
            translateY(15px);
    }

    to{
        opacity:.75;
        transform:
            translateX(-50%)
            translateY(0);
    }
}

/* MOBILE */

@media(max-width:600px){

    .subtitle{
        letter-spacing:4px;
    }

    .message{
        padding:0 20px;
    }

    .emojis{
        letter-spacing:4px;
    }

    .flower{
        font-size:38px;
    }

    .continue-btn{
        left:50%;
        right:auto;

        transform:translateX(-50%);

        bottom:30px;

        white-space:nowrap;
    }

    .continue-btn:hover{
        transform:
            translateX(-50%)
            translateY(-3px)
            scale(1.04);
    }
}

</style>
</head>

<body>

<div class="scene">

    <div class="grain"></div>

    <div class="light"></div>

    <!-- OPENING -->

    <div class="opening">

        <div class="opening-small">
            A little surprise for
        </div>

        <div class="opening-main">
            someone very special...
        </div>

    </div>

    <!-- FLOWERS -->

    <div class="flower">🌹</div>
    <div class="flower">🌸</div>
    <div class="flower">🌷</div>
    <div class="flower">🌺</div>

    <div class="flower">🌹</div>
    <div class="flower">🌸</div>
    <div class="flower">🌷</div>
    <div class="flower">🌺</div>

    <!-- BIRTHDAY -->

    <div class="birthday">

        <div class="subtitle">
            ✦ Today is all about you ✦
        </div>

        <div class="birthday-title">
            Happy Birthday
        </div>

        <div class="name">
            Vaishnavi
        </div>

        <div class="line"></div>

        <div class="message">
            May your smile always shine brighter than the stars. ❤️
        </div>

    </div>

    <!-- PETALS -->

    <div class="petal" style="left:4%;animation-duration:9s;">
        🌸
    </div>

    <div class="petal" style="left:14%;animation-duration:12s;animation-delay:2s;">
        🌹
    </div>

    <div class="petal" style="left:25%;animation-duration:8s;animation-delay:4s;">
        🌸
    </div>

    <div class="petal" style="left:38%;animation-duration:11s;animation-delay:1s;">
        🌷
    </div>

    <div class="petal" style="left:53%;animation-duration:9s;animation-delay:3s;">
        🌸
    </div>

    <div class="petal" style="left:67%;animation-duration:13s;animation-delay:5s;">
        🌹
    </div>

    <div class="petal" style="left:79%;animation-duration:8s;animation-delay:2s;">
        🌸
    </div>

    <div class="petal" style="left:92%;animation-duration:10s;animation-delay:4s;">
        🌷
    </div>

    <!-- HEARTS -->

    <div class="heart" style="left:12%;animation-delay:1s;">💗</div>
    <div class="heart" style="left:32%;animation-delay:4s;">💕</div>
    <div class="heart" style="left:68%;animation-delay:2s;">💖</div>
    <div class="heart" style="left:88%;animation-delay:5s;">💗</div>

    <!-- NEXT -->

    <a href="memories.html" class="continue-btn">
        ✦ There's more for you! ✦
    </a>

</div>

<script>

const scene = document.querySelector(".scene");

for(let i=0;i<70;i++){

    const particle =
        document.createElement("div");

    particle.className="particle";

    particle.style.left =
        Math.random()*100+"%";

    particle.style.top =
        Math.random()*100+"%";

    particle.style.animationDelay =
        Math.random()*4+"s";

    particle.style.animationDuration =
        3+Math.random()*4+"s";

    scene.appendChild(particle);
}

</script>

</body>
</html>
